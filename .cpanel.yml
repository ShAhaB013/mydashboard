---
# ═══════════════════════════════════════════════════════════════
# .cpanel.yml — اسکریپتِ دیپلویِ cPanel Git™ Version Control
#
# با هر بار «Update from Remote» + «Deploy» در cPanel اجرا می‌شود و
# محتوای ریپو را داخل public_html کپی می‌کند.
#
# مسیرِ دیپلوی از $HOME استفاده می‌کند (cPanel روی هر هاستی خودش آن را به
#    home directory همان کاربر ست می‌کند) تا فایل بینِ هاستِ تست و اصلی بدونِ
#    تغییر کار کند. اگر دامنه addon است، به‌جای public_html مسیرِ document
#    root واقعیِ آن دامنه را بگذار (مثلاً $HOME/addonsite.com).
#
# نکته‌ها:
#  • بدونِ --delete است (افزایشی) تا چیزی پاک نشود؛ پس uploads/ (تصاویرِ
#    آپلودیِ کاربر) و فایل‌های رانتایم امن می‌مانند.
#  • data/ مستثناست تا ویرایش‌های رانتایمِ آیکون/دکو (که از پنل روی هاست
#    انجام می‌شوند) با نسخه‌ی ریپو بازنویسی نشوند.
#  • dotfileها (.htaccess / .user.ini) با rsync کپی می‌شوند.
# ═══════════════════════════════════════════════════════════════
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /usr/bin/rsync -a --exclude='.git' --exclude='.gitignore' --exclude='.gitattributes' --exclude='.claude' --exclude='.cpanel.yml' --exclude='data/' --exclude='dev-router.php' --exclude='CLAUDE.md' --exclude='README.md' --exclude='config.example.php' ./ "$DEPLOYPATH/"
